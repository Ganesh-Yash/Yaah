# A complete BalanceVault deployment: PostgreSQL, Redis, schema migrations,
# database roles, and the API.
#
# Ordering matters and is encoded here:
#   1. db + redis become healthy
#   2. migrate  runs `prisma migrate deploy` (owns the DDL)
#   3. grants   creates the two roles and applies least-privilege grants
#   4. api      starts with the *application* role, never the migrator
#
# First admin: see the `bootstrap` profile below. It is deliberately not part of
# `up`, so a stray restart cannot create a second admin.
#
#   cp .env.example .env && docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml --profile bootstrap run --rm bootstrap \
#       --email you@example.com --name "Ops" --print-token

name: balancevault

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-balancevault}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-balancevault}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    # Rate-limit counters are worth surviving a restart; they are cheap.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${REDIS_PORT:-6379}:6379"

  migrate:
    image: node:20-alpine
    working_dir: /prisma
    environment:
      # The migrator is the only component with DDL rights.
      DATABASE_URL: postgresql://balancevault_migrator:${MIGRATOR_PASSWORD:?set MIGRATOR_PASSWORD}@db:5432/${POSTGRES_DB:-balancevault}
    volumes:
      - ../prisma:/prisma
    command: sh -c "npm install --no-audit --no-fund && npx prisma migrate deploy"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  grants:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - ./postgres:/sql:ro
    # 01 creates the roles (and gives the migrator the schema); 02 grants the
    # per-table privileges once the tables exist.
    command: >
      sh -c "psql -h db -U postgres -d ${POSTGRES_DB:-balancevault} -v ON_ERROR_STOP=1 -f /sql/01-roles.sql &&
             psql -h db -U postgres -d ${POSTGRES_DB:-balancevault} -v ON_ERROR_STOP=1 -c \"ALTER ROLE balancevault_migrator PASSWORD '${MIGRATOR_PASSWORD}'\" &&
             psql -h db -U postgres -d ${POSTGRES_DB:-balancevault} -v ON_ERROR_STOP=1 -c \"ALTER ROLE balancevault_app PASSWORD '${APP_PASSWORD}'\" &&
             psql -h db -U postgres -d ${POSTGRES_DB:-balancevault} -v ON_ERROR_STOP=1 -f /sql/02-grants.sql"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: ../backend
    environment:
      LEDGERLINE_ENV: production
      LEDGERLINE_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # The application role: no CREATE, no UPDATE on the ledger.
      LEDGERLINE_DATABASE_URL: postgresql://balancevault_app:${APP_PASSWORD}@db:5432/${POSTGRES_DB:-balancevault}
      LEDGERLINE_REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      grants:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # One-shot: create the first admin. `docker compose --profile bootstrap run ...`
  bootstrap:
    build:
      context: ../backend
    profiles: ["bootstrap"]
    environment:
      LEDGERLINE_DATABASE_URL: postgresql://balancevault_migrator:${MIGRATOR_PASSWORD}@db:5432/${POSTGRES_DB:-balancevault}
      LEDGERLINE_JWT_SECRET: ${JWT_SECRET}
    entrypoint: ["python", "-m", "scripts.bootstrap_admin"]
    depends_on:
      grants:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
