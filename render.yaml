# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Dashboard route: New + → Blueprint → pick this repository → Apply.
#
# Two things to set before you click Apply:
#
#   branch  Render deploys from a git branch, not from a local directory (that is
#           the main difference from Fly) — and `branch:` below is what it obeys.
#           This value, not the branch picker in the dashboard, decides which
#           commit is built: a blueprint whose picker said one branch still
#           deployed `main` because this line said `main`, and the deploy then ran
#           code that had none of the features configured above it. Change this
#           line when the target changes (e.g. to `main` once this work is
#           merged), then sync the blueprint.
#   region  `singapore` because Neon has no India region and Upstash/Render/Fly
#           all do have Singapore. Keep the database in the same region: a
#           cross-region database costs ~50 ms *per query*, and one transfer is
#           several queries.
#
# Cost: this blueprint is the zero-cost configuration. `free` does not mean
# instant, and the two facts that follow from it are stated here rather than
# discovered during a demo:
#
#   * a free web service spins down after 15 minutes without traffic and the next
#     request waits about a minute for it to boot;
#   * the plan is written out explicitly. Omitting `plan` lets Render default to a
#     paid instance type, which is the one mistake here that costs money.
#
# Upgrading is a dropdown in the dashboard, not an edit to this file: switching
# this service to `starter` (~$7/month) removes the sleep entirely.
services:
  - type: web
    name: balancevault
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: arena/686afbca-yaah
    region: singapore
    plan: free
    # 200 only when the database answers AND the schema is present — not merely
    # "the process started". Neon's free plan suspends when idle; on a free Render
    # service that is fine, because the whole service sleeps anyway.
    healthCheckPath: /api/ready
    autoDeploy: true
    envVars:
      - key: LEDGERLINE_ENV
        value: prod
      # 256 bits, generated by Render, never in the repository.
      - key: LEDGERLINE_JWT_SECRET
        generateValue: true
      # Neon (same region) with ?sslmode=require. Set in the dashboard.
      # Do NOT point this at free Render Postgres: it expires 30 days after
      # creation, and the whole ledger goes with it.
      - key: LEDGERLINE_DATABASE_URL
        sync: false
      # Upstash (same region), rediss:// — TLS, not redis://.
      - key: LEDGERLINE_REDIS_URL
        sync: false
      # Free instances have no Shell tab, so there is no `bootstrap_admin` to run.
      # Set this to 1 to seed the documented demo users on first boot (an ADMIN
      # among them), then change that password from the dashboard and set this
      # back to 0. Left off, the cleanest path is to run the bootstrap script from
      # your own machine against the Neon URL — see docs/DEPLOYMENT.md.
      # - key: LEDGERLINE_DEMO_SEED
      #   value: "1"
      #
      # Optional: the migrator credential, if the API role has no DDL rights.
      # - key: LEDGERLINE_MIGRATION_DATABASE_URL
      #   sync: false
      #
      # The host allowlist is normally left unset: the image reads the
      # RENDER_EXTERNAL_HOSTNAME that Render injects. Set this explicitly only to
      # add a custom domain.
      # - key: LEDGERLINE_TRUSTED_HOSTS
      #   sync: false

# Note on migrations: the container runs `python -m scripts.migrate` on boot
# (scripts/start.sh) before uvicorn starts, so this blueprint needs no pre-deploy
# command — which is fortunate, because a pre-deploy command is not available on
# every plan. Paid instances can use one instead; it runs before traffic is
# switched over and fails the deploy rather than restart-looping:
#
#     preDeployCommand: python -m scripts.migrate
#
# If you add it, also set LEDGERLINE_SKIP_STARTUP_MIGRATION=1 to avoid doing the
# same work twice.
