# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Dashboard route: New + → Blueprint → pick this repository → Apply.
#
# Two things to set before you click Apply:
#
#   branch  Render deploys from a git branch, not from a local directory (that is
#           the main difference from Fly). Point this at the branch you want live;
#           `main` is the default, so a branch that is not merged yet must be named
#           here, or be promoted to main first.
#   region  `singapore` because Neon has no India region and Upstash/Fly/Render
#           all do have Singapore. Keep the database in the same region: a
#           cross-region database costs ~50 ms *per query*, and one transfer is
#           several queries.
#
# The plan is deliberately not `free`:
#   * free web services spin down after 15 minutes of inactivity, and a sleeping
#     service answers the first click with ~30 s of nothing;
#   * free Render Postgres databases expire after 30 days.
# Both are disqualifying for a link that judges may open at any time.
services:
  - type: web
    name: balancevault
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    region: singapore
    plan: starter
    # 200 only when the database answers AND the schema is present — not merely
    # "the process started". Neon's free plan suspends when idle and this check
    # keeps it awake, so on Neon free point this at /api/health instead (see
    # docs/DEPLOYMENT.md, "Deploying on Render").
    healthCheckPath: /api/ready
    autoDeploy: true
    envVars:
      - key: LEDGERLINE_ENV
        value: prod
      # 256 bits, generated by Render, never in the repository.
      - key: LEDGERLINE_JWT_SECRET
        generateValue: true
      # Neon (same region) with ?sslmode=require. Set in the dashboard.
      - key: LEDGERLINE_DATABASE_URL
        sync: false
      # Upstash (same region), rediss:// — TLS, not redis://.
      - key: LEDGERLINE_REDIS_URL
        sync: false
      # Optional: the migrator credential, if the API role has no DDL rights.
      # - key: LEDGERLINE_MIGRATION_DATABASE_URL
      #   sync: false
      #
      # The host allowlist is normally left unset: the image reads the
      # RENDER_EXTERNAL_HOSTNAME that Render injects. Set this explicitly only to
      # add a custom domain.
      # - key: LEDGERLINE_TRUSTED_HOSTS
      #   sync: false

# Note on migrations: the container runs `python -m scripts.migrate` on boot
# (scripts/start.sh) before uvicorn starts, so this blueprint needs no pre-deploy
# command. Paid instances can use one instead — it runs before traffic is switched
# over and fails the deploy rather than restart-looping:
#
#     preDeployCommand: python -m scripts.migrate
#
# If you add it, also set LEDGERLINE_SKIP_STARTUP_MIGRATION=1 to avoid doing the
# same work twice.
